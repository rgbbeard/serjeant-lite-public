# PUBLIC ROUTES
[home]
path = "serjeant/home"
match_type = regex
params[page] = "%d"
function = get_home
authenticated = true
authentication = user_login
roles[] = JIRA_USER

[about]
path = serjeant/about
match_type = plain
function = get_about

[user_login]
path = serjeant/login
match_type = plain
function = get_user_login

[user_registration]
path = serjeant/register
match_type = plain
function = get_user_registration

[user_logout]
path = serjeant/logout
match_type = plain
function = exec_user_logout

[user_profile]
path = serjeant/profile
match_type = plain
function = get_user_profile
authenticated = true
authentication = user_login
roles[] = JIRA_USER

[add_issue_note]
path = serjeant/add-note
match_type = regex
params[issue_id] = "%d"
function = get_add_issue_note
authenticated = true
authentication = user_login
roles[] = JIRA_USER

[issues_notes]
path = serjeant/notes
match_type = plain
function = get_issues_notes
authenticated = true
authentication = user_login
roles[] = JIRA_USER

[exec_add_issue_note]
path = serjeant/exec-add-issue-note
match_type = plain
funcion = exec_add_issue_note
authenticated = true
authentication = user_login
roles[] = JIRA_USER

# ADMIN ROUTES
[admin]
path = admin
match_type = plain
function = get_admin_home
authenticated = true
roles[] = ROLE_ADMIN
authentication = admin_login

[admin_login]
path = admin/login
match_type = plain
function = get_admin_login

[admin_logout]
path = admin/logout
match_type = plain
function = exec_admin_logout

# API ROUTES
[update_user_infos]
path = serjeant/profile/update-infos
match_type = plain
function = exec_update_user_profile_infos
authenticated = true
authentication = user_login
roles[] = JIRA_USER

# ADMIN API ROUTES
